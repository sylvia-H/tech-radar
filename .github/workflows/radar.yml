name: Tech Radar

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '晨報乾跑：跳過 18h guard、照常抓取與策展（消耗 1 次策展配額），結果推到告警頻道；不推晨報頻道、不寫狀態、不跑榜單段、不發佈 Pages'
        type: boolean
        default: false
      replay_date:
        description: '晨報補發：台北日期 YYYY-MM-DD；填了即為補發模式：以當日已推標題重新策展（消耗 1 次策展配額）、推到告警頻道，不寫狀態；隱含乾跑（不必另勾 dry_run）'
        type: string
        default: ''
  schedule:
    # UTC 20:07 → 台北 04:07（主排；2026-09-26 由 22:07 提前 2h，抵銷 Actions 排程約 2h 延遲）
    - cron: '7 20 * * *'
    # UTC 20:37 → 台北 04:37（補跑）
    - cron: '37 20 * * *'

concurrency:
  group: tech-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 此 checkout 不需推送；推回狀態只在 state-branch 那份 checkout 內進行
          persist-credentials: false

      - name: Checkout state branch
        uses: actions/checkout@v5
        with:
          ref: state
          path: state-branch

      - name: Load state into workspace
        run: |
          mkdir -p state
          cp state-branch/state/board.json state/board.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # 不執行相依套件的 install script（此 job 帶 token 與 Secrets）；現況見 dev-guide §8.y、理由見 ADR 0008
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run Tech Radar
        id: run-app
        # 步驟層逾時（2026-10-27，ADR 0009）：Gemini 卡住時策展最壞 20 分鐘（主備各一個 10 分鐘總期限，已含退避），榜單日
        # 簡介＋TL;DR 約 10 分鐘（第一則簡介慢失敗後其餘熔斷）。設在步驟而非 job：逾時算本步失敗，下方 Commit state 仍會
        # 落檔已推出的狀態、failure() 告警仍會送出，不會無聲。
        timeout-minutes: 60
        run: node dist/main.cli.js
        env:
          # schedule 觸發時 inputs 為空物件、inputs.* 皆為 null → '0'；只有手動勾選 dry_run 或填了
          # replay_date 才是 '1'（補發隱含乾跑）。replay_date 以 truthiness 判斷：null 與 '' 同為 falsy，
          # 不依賴 null 與 '' 的跨型別比較。
          NEWS_DRY_RUN: ${{ (inputs.dry_run == true || inputs.replay_date) && '1' || '0' }}
          # schedule 時 null 展開為空字串；CLI 以非空判定補發，並驗證 YYYY-MM-DD 格式（不合法即失敗＋告警）
          NEWS_REPLAY_DATE: ${{ inputs.replay_date }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          DISCORD_BOARD_WEBHOOK_URL: ${{ secrets.DISCORD_BOARD_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit state (on change only)
        id: commit-state
        # 狀態只 commit 到獨立的 state 分支，develop/main 不再出現 bot commit（見
        # dev-guide §8）。乾跑／補發不寫狀態，整步跳過（schedule 時 inputs.* 為 null：
        # null != true 為真、!null 為真 → 照常執行）。
        # !cancelled()（2026-10-27，ADR 0009）：Run Tech Radar 失敗（含步驟逾時被砍）時仍執行——榜單段可能已推播並原子
        # save 本機 board.json，晨報段才卡住；不落檔的話 :37 補跑讀到舊狀態會重推同一份榜單。save() 是原子寫入且只在
        # 推播成功後才寫，失敗時 commit 本機檔是安全的；沒寫過的話 git diff 無變更、照常跳過。run-app 為 skipped（之前的
        # checkout／安裝／build 失敗、CLI 根本沒跑）時不執行，免得以不相干的錯誤再失敗一次、誤導告警分流。
        if: ${{ !cancelled() && steps.run-app.outcome != 'skipped' && inputs.dry_run != true && !inputs.replay_date }}
        run: |
          cp state/board.json state-branch/state/board.json
          cd state-branch
          git add state/board.json
          if git diff --cached --quiet; then
            echo "狀態無變更，跳過 commit"
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git commit -m "chore: update board state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "狀態已推回（第 ${attempt} 次嘗試）"
              exit 0
            fi
            echo "第 ${attempt} 次推回失敗，重試中…"
            sleep 3
          done
          echo "::error::狀態 commit/push 重試 3 次仍失敗"
          exit 1

      - name: Failure alert (CLI 未送出告警的任何失敗)
        # CLI 成功送出告警後會寫 .radar-alert-sent marker；此步只在 marker 缺席時補送。
        # 去重依據是「CLI 明確回報已送出」而非 run-app 的 outcome，因此涵蓋
        # app 啟動前失敗（env 驗證/DI）、CLI 告警送出失敗、Run Tech Radar 步驟逾時（60 分鐘，CLI 被砍、來不及送）、
        # 狀態 commit/push 失敗。文案帶兩步的 outcome 供分流。
        if: failure()
        run: |
          if [ -f .radar-alert-sent ]; then
            echo "CLI 已送出失敗告警，跳過補送"
            exit 0
          fi
          curl -sf -H "Content-Type: application/json" \
            -d '{"username":"Tech Radar","embeds":[{"title":"⚠️ Tech Radar 執行失敗","description":"workflow 失敗且 CLI 未送出告警（啟動前失敗、告警送出失敗、Run Tech Radar 步驟逾時 60 分鐘或狀態 commit/push 失敗；逾時時榜單可能已推出，狀態已嘗試落檔）。run=${{ steps.run-app.outcome }}、commit-state=${{ steps.commit-state.outcome }}，請查 Actions log","color":15158322}]}' \
            "$DISCORD_ALERT_WEBHOOK_URL"
        env:
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}

  publish:
    needs: radar
    # 乾跑／補發不改狀態，無需重新發佈 Pages（schedule 時 inputs.* 為 null，條件為真、照常發佈）
    if: ${{ inputs.dry_run != true && !inputs.replay_date }}
    runs-on: ubuntu-latest
    permissions:
      # job 層 permissions 會整組取代 workflow 層的 contents: write，未列出的 scope 一律為
      # none；contents: read 不可省，否則下方兩個 checkout 會失去 repo 讀取權
      # （contracts/publish-orchestration.md C1）。
      contents: read
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout state branch
        uses: actions/checkout@v5
        with:
          ref: state
          path: state-branch
          persist-credentials: false

      - name: Load state into workspace
        run: |
          mkdir -p state
          cp state-branch/state/board.json state/board.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # 不執行相依套件的 install script：本 job 有 id-token: write／pages: write（任何步驟都能向 runner 請求
        # OIDC token），兩個 checkout 皆不保留 GITHUB_TOKEN。現況見 dev-guide §8.y、理由見 ADR 0008
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run publish
        run: node dist/main.cli.js
        env:
          PUBLISH_MODE: '1'
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          DISCORD_BOARD_WEBHOOK_URL: ${{ secrets.DISCORD_BOARD_WEBHOOK_URL }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Pages artifact
        if: hashFiles('public/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: hashFiles('public/index.html') != ''
        uses: actions/deploy-pages@v4

      - name: Alert on publish job failure
        # 刻意用裸 failure() 涵蓋本 job 的**任何**失敗——checkout／載入 state／npm ci／build／
        # 上傳 artifact／部署皆算，寧可多報也不要漏報（與 radar job 的補送告警同一原則）。
        # 因此訊息 MUST NOT 斷言失敗發生在部署那一步。PublishService 內部已處理的分支
        # （private 跳過／可見性查詢失敗／渲染寫檔失敗）皆以 exit 0 結束並自行發告警，
        # 不會走到這裡（research D10a）。
        if: failure()
        run: |
          curl -sS -X POST -H "Content-Type: application/json" \
            -d '{"embeds":[{"title":"⚠️ 發佈 job 失敗","color":15548997,"description":"Pages 發佈 job 的某個步驟失敗（環境準備、建置、上傳 artifact 或部署），請查看本次 Actions 執行紀錄確認失敗步驟。"}]}' \
            "$DISCORD_ALERT_WEBHOOK_URL"
        env:
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
